name: Update views badge

on:
  schedule:
    # 매일 06:00 UTC (15:00 KST). Traffic API는 최대 2일 지연 반영.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read page views from Traffic API
        id: views
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          COUNT=$(gh api repos/argenluna/maintenance/traffic/views --jq '.count')
          if [ -z "$COUNT" ] || [ "$COUNT" = "null" ]; then
            echo "::error::traffic/views count 조회 실패"
            exit 1
          fi
          echo "Views count: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Patch README badge
        env:
          COUNT: ${{ steps.views.outputs.count }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          path = pathlib.Path('README.md')
          text = path.read_text(encoding='utf-8')
          updated, n = re.subn(r'(badge/views-)\d+(-blue)', rf'\g<1>{os.environ["COUNT"]}\g<2>', text, count=1)
          if n != 1:
              raise SystemExit('views badge pattern not found in README.md')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'No change'
          else
            git commit -m 'chore: 조회수 배지 자동 갱신'
            git push
          fi
